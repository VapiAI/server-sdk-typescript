name: ci

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up node
        uses: actions/setup-node@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up node
        uses: actions/setup-node@v6

      - name: Test release validation
        run: node --test .github/scripts/validate-release.test.cjs

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  package:
    needs: [ compile, test ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate release tag
        run: node .github/scripts/validate-release.cjs

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Select npm dist-tag
        id: release
        run: |
          if [[ ${GITHUB_REF} == *alpha* ]]; then
            dist_tag=alpha
          elif [[ ${GITHUB_REF} == *beta* ]]; then
            dist_tag=beta
          else
            PKG_NAME=$(node -p "require('./package.json').name")
            PKG_VERSION=$(node -p "require('./package.json').version")
            CURRENT_LATEST=$(npm view "${PKG_NAME}" dist-tags.latest 2>/dev/null || echo "0.0.0")
            if npx -y semver "${PKG_VERSION}" -r "<${CURRENT_LATEST}" > /dev/null 2>&1; then
              dist_tag=backport
            else
              dist_tag=latest
            fi
          fi
          echo "dist-tag=${dist_tag}" >> "$GITHUB_OUTPUT"

      - name: Pack npm artifact
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"

      - name: Upload npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      # Keep package code and caches out of the job with publishing authority.
      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download npm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: .release

      - name: Publish npm artifact
        env:
          DIST_TAG: ${{ needs.package.outputs.dist-tag }}
        run: |
          tarballs=(.release/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 || ! -f "${tarballs[0]}" ]]; then
            echo "::error::Expected exactly one npm package tarball."
            exit 1
          fi
          case "$DIST_TAG" in
            latest|alpha|beta|backport) ;;
            *) echo "::error::Unexpected npm dist-tag."; exit 1 ;;
          esac
          npm publish "${tarballs[0]}" --access public --ignore-scripts --tag "$DIST_TAG"
